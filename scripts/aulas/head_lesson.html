<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171310; --surface:#1F1A15; --surface-2:#271F18;
  --border:#3A2F24; --border-2:#4A3C2D;
  --ink:#F3ECE2; --muted:#AE9F8C;
  --accent:#DE8B62; --accent-ink:#F0AB86; --accent-soft:#3A281F;
  --good:#8FC0A8; --good-soft:#243128;
  --warn:#DDB662; --warn-soft:#362A16;
  --danger:#DE8A80; --danger-soft:#3A2321;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --display:'Fraunces', Georgia, serif;
  --body-f:'Inter', system-ui, sans-serif;
}
@page{ size:960pt 540pt; margin:.5in .55in; background:#171310 }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:var(--body-f);font-size:13px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto}
section.block{page-break-before:always;break-before:page}
section.block:first-child{page-break-before:auto;break-before:auto}

/* cabeçalho de página */
.pagehead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:14px}
.pagehead .n{color:var(--accent-ink)}
h2{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.2;margin:0 0 6px}
h2 em{color:var(--accent-ink);font-style:italic}
.intro{color:var(--muted);margin:0 0 14px;font-size:13px;max-width:780px}
strong{color:var(--ink);font-weight:600}
code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);color:var(--accent-ink);padding:1px 5px;border-radius:4px}

/* capa */
.cover{min-height:600px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:8px;margin-bottom:16px}
.eyebrow .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent)}
.cover h1{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.08;margin:0 0 16px}
.cover h1 em{color:var(--accent-ink);font-style:italic}
.lead{color:var(--muted);font-size:15px;max-width:640px;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-family:var(--mono);font-size:10.5px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--border-2);padding:4px 11px;border-radius:999px}
.byline{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:26px}

/* grids e cards */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card h3{font-size:13.5px;font-weight:600;margin:0 0 5px;color:var(--ink)}
.card p{margin:0;color:var(--muted);font-size:12px}
.card .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}

/* passos */
.steps{display:grid;gap:9px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.step .b{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#171310;font-family:var(--mono);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center}
.step h3{font-size:13.5px;margin:0 0 2px;font-weight:600}
.step p{margin:0;color:var(--muted);font-size:12px}

/* terminal */
.term{background:#100D0A;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-family:var(--mono);font-size:11.3px;line-height:1.55;white-space:pre-wrap;color:var(--ink);margin:0}
.term .c{color:var(--muted)}
.term-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

/* tabelas */
.table-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surface-2);font-family:var(--mono);text-transform:uppercase;font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 12px;font-weight:500}
td{border-top:1px solid var(--border);padding:8px 12px;vertical-align:top;background:var(--surface)}
td:first-child{font-weight:600}

/* callouts e listas */
.callout{border:1px solid var(--border-2);background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:12.3px;margin-top:12px}
.callout.good{background:var(--good-soft);border-color:#35493B}
.callout.warn{background:var(--warn-soft);border-color:#54421F}
.callout.danger{background:var(--danger-soft);border-color:#5A3431}
.bullets{list-style:none;padding:0;margin:0}
.bullets li{position:relative;padding-left:17px;margin:5px 0;font-size:12.3px;color:var(--ink)}
.bullets li::before{content:"●";position:absolute;left:0;top:.15em;color:var(--accent);font-size:.7em}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{position:relative;padding-left:20px;margin:6px 0;font-size:12.5px}
.checklist li::before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:700}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.qtext{font-weight:600;font-size:13.3px;margin:0 0 9px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opts div{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;padding:6px 10px;font-size:12px}
.answer{margin-top:9px;background:var(--good-soft);border:1px solid #35493B;border-radius:7px;padding:7px 11px;font-size:12px}
.answer b{color:var(--good)}

.next{font-family:var(--mono);font-size:11px;color:var(--accent-ink);margin-top:22px}
.source{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<style>
td{font-size:11.1px}
.sim{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);border:1px solid #54421F;margin-left:6px;text-transform:uppercase;vertical-align:middle}
.term{font-size:10.6px}
.term .u{color:var(--accent-ink);font-weight:600}
.term .b{color:var(--ink);font-weight:600}
.term .ok{color:var(--good);font-weight:600}
.shot{display:block;width:100%;border-radius:10px;border:1px solid var(--border-2)}
.shot-cap{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:5px;text-align:center}
.promptbox{background:#100D0A;border:1px solid var(--accent);border-radius:10px;padding:10px 13px;font-family:var(--mono);font-size:10.3px;line-height:1.55;white-space:pre-wrap;color:var(--ink)}
.promptbox .h{color:var(--accent-ink);font-weight:600}
.code{background:#100D0A;border:1px solid var(--border-2);border-radius:10px;padding:10px 13px;font-family:var(--mono);font-size:9.8px;line-height:1.5;white-space:pre;color:var(--ink)}
.code .c{color:var(--muted)}
.code .k{color:var(--accent-ink)}
.after{border:1px solid #35493B;background:var(--good-soft);border-radius:10px;padding:4px 12px 10px;margin-top:4px}
.after .t{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--good);margin:8px 0 6px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:6px 0 4px;align-items:stretch}
.flow .n{position:relative;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:11px 12px;margin-right:18px;font-size:11.2px;line-height:1.42;color:var(--muted)}
.flow .n:not(:last-child)::after{content:"→";position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700;font-size:15px}
.flow .n:last-child{margin-right:0}
.flow b{display:block;font-family:var(--mono);font-size:9.8px;color:var(--accent-ink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.flow .n.key{border-color:var(--good);background:var(--good-soft)}.flow .n.key b{color:var(--good)}
.kbd{display:inline-block;font-family:var(--mono);font-size:.85em;padding:0 5px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;background:var(--surface-2);color:var(--ink);line-height:1.5}
.g5{grid-template-columns:repeat(5,1fr)}
</style>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171310; --surface:#1F1A15; --surface-2:#271F18;
  --border:#3A2F24; --border-2:#4A3C2D;
  --ink:#F3ECE2; --muted:#AE9F8C;
  --accent:#DE8B62; --accent-ink:#F0AB86; --accent-soft:#3A281F;
  --good:#8FC0A8; --good-soft:#243128;
  --warn:#DDB662; --warn-soft:#362A16;
  --danger:#DE8A80; --danger-soft:#3A2321;
  --mono:'IBM Plex Mono', ui-monospace, monospace;
  --display:'Fraunces', Georgia, serif;
  --body-f:'Inter', system-ui, sans-serif;
}
@page{ size:A4; margin:15mm; background:#171310 }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:var(--body-f);font-size:10.6px;line-height:1.55}
.wrap{max-width:730px;margin:0 auto}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;margin:0 0 12px}
h1 em,h2 em{color:var(--accent-ink);font-style:italic}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
h2 .n{font-family:var(--mono);font-size:11px;color:var(--accent-ink);font-weight:500}
h3{font-size:11.6px;font-weight:600;margin:12px 0 5px;color:var(--ink)}
p{margin:0 0 7px}
.muted{color:var(--muted)}
strong{color:var(--ink);font-weight:600}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);color:var(--accent-ink);padding:1px 4px;border-radius:4px}
section.sec{margin-top:20px;padding-top:12px;border-top:1px solid var(--border)}
section.sec.brk{page-break-before:always;break-before:page;border-top:none;margin-top:0;padding-top:0}
.intro{color:var(--muted);margin:0 0 9px}
/* header */
.header{padding:8px 0 16px;border-bottom:1px solid var(--border);margin-bottom:6px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent)}
.lead{color:var(--muted);font-size:12px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--mono);font-size:9.5px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--border-2);padding:3px 9px;border-radius:999px}
.byline{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:12px}
/* toc */
.toc{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:14px}
.toc div{font-size:10.4px;color:var(--muted);display:flex;gap:8px}
.toc b{font-family:var(--mono);color:var(--accent-ink);font-weight:500;width:18px}
/* grid/cards */
.grid{display:grid;gap:9px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px;break-inside:avoid}
.card .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:3px}
.card p{margin:0;color:var(--muted);font-size:10.2px}
/* tables */
.table-wrap{border:1px solid var(--border);border-radius:9px;overflow:hidden;margin:6px 0 8px;break-inside:avoid}
table{width:100%;border-collapse:collapse;font-size:10px}
th{background:var(--surface-2);font-family:var(--mono);text-transform:uppercase;font-size:8.6px;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 9px;font-weight:500}
td{border-top:1px solid var(--border);padding:6px 9px;vertical-align:top;background:var(--surface)}
td:first-child{font-weight:600}
/* code */
.term{background:#100D0A;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-family:var(--mono);font-size:9.8px;line-height:1.55;white-space:pre-wrap;color:var(--ink);margin:6px 0 8px;break-inside:avoid}
.term .c{color:var(--muted)}
/* callouts */
.callout{border:1px solid var(--border-2);background:var(--accent-soft);border-radius:9px;padding:8px 11px;font-size:10.2px;margin:7px 0;break-inside:avoid}
.callout.good{background:var(--good-soft);border-color:#35493B}
.callout.warn{background:var(--warn-soft);border-color:#54421F}
.callout.danger{background:var(--danger-soft);border-color:#5A3431}
/* steps */
.steps{display:grid;gap:6px;margin:6px 0 8px}
.step{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 10px;break-inside:avoid}
.step .b{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#171310;font-family:var(--mono);font-weight:600;font-size:10px;display:flex;align-items:center;justify-content:center}
.step div:last-child{font-size:10.2px}
.checklist{list-style:none;padding:0;margin:4px 0 8px}
.checklist li{position:relative;padding-left:17px;margin:4px 0}
.checklist li::before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:700}
.bullets{list-style:none;padding:0;margin:4px 0 8px}
.bullets li{position:relative;padding-left:14px;margin:4px 0}
.bullets li::before{content:"●";position:absolute;left:0;top:.2em;color:var(--accent);font-size:.65em}
.source{font-family:var(--mono);font-size:8.8px;color:var(--muted);line-height:1.6}
.foot{margin-top:12px;padding-top:8px;border-top:1px solid var(--border)}
h2,h3,.intro{break-after:avoid;page-break-after:avoid}
section.sec.keep{break-inside:avoid;page-break-inside:avoid}
h3+.table-wrap,h3+.steps,h3+p,h3+.term,h3+ul{break-before:avoid}
</style>

<style>
.osbar{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border-2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.osbar .ic{font-size:24px;width:36px;text-align:center}
.osbar b{font-family:var(--display);font-size:22px;font-weight:600}
.osbar span{display:block;color:var(--muted);font-size:10.2px}
.kbd{font-family:var(--mono);font-size:.9em;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}
</style>
</head>
<body>
